# ── Upstream — Node.js приложение ───────────────────────────────────────────
upstream metro_memory {
    server 127.0.0.1:3000;

    # Keepalive: держим пул постоянных соединений к Node.js
    # Снижает латентность и нагрузку на TCP-стек
    keepalive 32;
}

# ── HTTP → HTTPS редирект ────────────────────────────────────────────────────
server {
    listen 80;
    # Ваш домен
    server_name memory.home.local;

    # ACME challenge для Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Основной HTTPS сервер ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    # Ваш домен
    server_name memory.home.local;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Современные протоколы (отключаем TLS 1.0/1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Session cache — ускоряет повторные TLS-рукопожатия
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — браузер запомнит: только HTTPS, 1 год
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Общие настройки ──────────────────────────────────────────────────────
    server_tokens off;          # Скрыть версию nginx в заголовках
    charset utf-8;

    # Логи (укажите свой путь)
    # access_log /var/log/nginx/metro-memory.access.log combined buffer=16k flush=5s;
    # error_log  /var/log/nginx/metro-memory.error.log warn;

    # Лимит размера тела запроса (достаточно для форм профиля)
    client_max_body_size 1m;

    # ── Gzip-сжатие ─────────────────────────────────────────────────────────
    # MP3 и PNG уже сжаты — их сжимать не нужно
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Socket.IO ────────────────────────────────────────────────────────────
    # КРИТИЧНО: этот блок должен быть ДО общего location /
    location /socket.io/ {
        proxy_pass http://metro_memory;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Стандартные proxy-заголовки
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Долгий таймаут для long-polling и WS
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;

        # Отключить буферизацию — WS/SSE должны идти мгновенно
        proxy_buffering off;

        # Мягкий rate-limit на подключения к Socket.IO
        limit_req zone=socketio burst=20 nodelay;
    }

    # ── API: аутентификация (жёсткий лимит) ─────────────────────────────────
    location ~ ^/api/(login|register|forgot-password|reset-password)$ {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";   # Keepalive к upstream
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 10 попыток в минуту на IP — защита от брутфорса
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
    }

    # ── API: остальные эндпоинты ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout  5s;

        # Буферизация ответов API
        proxy_buffering on;
        proxy_buffer_size      8k;
        proxy_buffers       8 16k;

        limit_req zone=api burst=15 nodelay;
        limit_req_status 429;
    }

    # ── Статические файлы: JS, CSS ───────────────────────────────────────────
    # Без asset hashing — используем ETag + короткий cache
    location ~* \.(js|css)$ {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Кешировать 1 час, перепроверять по ETag
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        gzip_static on;
    }

    # ── Статические файлы: аудио ─────────────────────────────────────────────
    # MP3 — уже сжаты, без gzip. Кешируем на 7 дней
    location ~* \.mp3$ {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=604800";

        # Поддержка Range-запросов (браузер может запросить часть файла)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 4 128k;
    }

    # ── Статические файлы: иконки, изображения ──────────────────────────────
    location ~* \.(png|ico|webp|svg)$ {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Иконки меняются редко — кешируем 30 дней
        add_header Cache-Control "public, max-age=2592000, immutable";

        proxy_buffering on;
    }

    # ── PWA Manifest ─────────────────────────────────────────────────────────
    location = /manifest.json {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=86400";
    }

    # ── Все остальные запросы → Node.js ──────────────────────────────────────
    location / {
        proxy_pass http://metro_memory;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout  5s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;

        # HTML: не кешировать — всегда актуальная версия
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Защита служебных файлов ──────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
